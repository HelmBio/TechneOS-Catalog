<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- subtle molecule motif, top-right corner -->
  <g stroke="#c7d2fe" stroke-width="2.5" fill="none" opacity="0.9">
    <line x1="1290" y1="120" x2="1360" y2="80"/>
    <line x1="1360" y1="80" x2="1440" y2="110"/>
    <line x1="1360" y1="80" x2="1380" y2="160"/>
    <line x1="1440" y1="110" x2="1500" y2="70"/>
    <line x1="1380" y1="160" x2="1450" y2="190"/>
  </g>
  <g fill="#4f46e5">
    <circle cx="1290" cy="120" r="7"/>
    <circle cx="1360" cy="80" r="9"/>
    <circle cx="1440" cy="110" r="7"/>
    <circle cx="1380" cy="160" r="7"/>
    <circle cx="1500" cy="70" r="6"/>
    <circle cx="1450" cy="190" r="6"/>
  </g>

  <!-- subtle molecule motif, bottom-left corner -->
  <g stroke="#e0e7ff" stroke-width="2.5" fill="none" opacity="0.9">
    <line x1="90" y1="760" x2="160" y2="800"/>
    <line x1="160" y1="800" x2="150" y2="850"/>
    <line x1="160" y1="800" x2="230" y2="790"/>
    <line x1="90" y1="760" x2="60" y2="820"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="90" cy="760" r="6"/>
    <circle cx="160" cy="800" r="8"/>
    <circle cx="150" cy="850" r="6"/>
    <circle cx="230" cy="790" r="6"/>
    <circle cx="60" cy="820" r="5"/>
  </g>

  <!-- main title block, centered -->
  <g text-anchor="middle">
    <text x="800" y="380" font-size="120" font-weight="700" fill="#0f172a">TechneOS</text>
    <text x="800" y="430" font-size="30" fill="#64748b" letter-spacing="1">Operating System for Research</text>

    <line x1="650" y1="475" x2="950" y2="475" stroke="#4f46e5" stroke-width="3"/>

    <text x="800" y="530" font-size="27" font-weight="600" fill="#312e81">
      A Platform Demo for Computational Chemists
    </text>
  </g>

  <!-- footer info block -->
  <g text-anchor="middle">
    <text x="800" y="800" font-size="20" font-weight="600" fill="#334155">Presented by Tianhong Zhang</text>
  </g>
</svg>
