<!DOCTYPE html>

<title>TechneOS — Demo Slides</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1e293b;
    font-family: Inter, Helvetica Neue, Arial, sans-serif;
    overflow: hidden;
  }
  .deck {
    position: relative;
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  .slide {
    display: none;
    width: 92vw; max-width: 1600px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .slide.active { display: block; }
  .slide svg { display: block; width: 100%; height: auto; }

  .controls {
    position: fixed; bottom: 22px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 18px; z-index: 10;
  }
  .nav-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #e2e8f0;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { background: rgba(255,255,255,0.12); }

  .dots { display: flex; gap: 10px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: none; cursor: pointer; padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .dot.active { background: #818cf8; transform: scale(1.3); }

  .counter {
    position: fixed; bottom: 26px; right: 28px;
    color: rgba(255,255,255,0.5);
    font-size: 13px; letter-spacing: 0.5px;
    z-index: 10;
  }
  .fs-btn {
    position: fixed; top: 20px; right: 24px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    z-index: 10;
  }
  .fs-btn:hover { background: rgba(255,255,255,0.25); }
  .hint {
    position: fixed; top: 20px; left: 24px;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    z-index: 10;
  }
</style>

<div class="controls">
  <button class="nav-btn" id="prevBtn" onclick="goTo(current - 1)" aria-label="Previous slide">&#8592;</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" onclick="goTo(current + 1)" aria-label="Next slide">&#8594;</button>
</div>
<div class="counter" id="counter"></div>

<script>
  var slides = document.querySelectorAll('.slide');
  var dotsContainer = document.getElementById('dots');
  var current = 0;

  slides.forEach(function (_, i) {
    var dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.onclick = function () { goTo(i); };
    dotsContainer.appendChild(dot);
  });

  function goTo(index) {
    if (index < 0 || index >= slides.length) return;
    slides[current].classList.remove('active');
    dotsContainer.children[current].classList.remove('active');
    current = index;
    slides[current].classList.add('active');
    dotsContainer.children[current].classList.add('active');
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
    document.getElementById('counter').textContent =
      (current + 1) + ' / ' + slides.length + '  —  ' + slides[current].dataset.name;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') goTo(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(current - 1);
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  goTo(0);
</script>

</body>
</html>
