[project]
name = "compound-clustering"
version = "0.1.0"
description = "Cluster compounds into chemical families via RDKit (Butina / Murcko scaffold) and scikit-learn (k-means)"
# 3.12 to match techneos/tool-runtime (pypi tools install into that worker image
# at dispatch time, and rdkit wheels lag newer Python).
requires-python = ">=3.12,<3.13"
dependencies = [
    # The clustering entry point writes outputs via techneos_tool_runtime.artifact_path.
    # Ambient in the techneos/tool-runtime image where pypi tools run; declared here so
    # the package resolves standalone (e.g. once catalog is split from the monorepo).
    "techneos-tool-runtime>=0.1,<1",
    # rdkit unbounded for now — matches the other catalog tools. Worth pinning in
    # a follow-up once we have an integration suite to verify upgrades against.
    "rdkit",
    "scikit-learn",
    "numpy",
    # Optional visualization (render_grid / render_chemical_space). matplotlib
    # also pulls in Pillow, which RDKit's Draw uses for the molecule grid.
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compound_clustering"]

[tool.techneos]
delivery = "pypi"
package_name = "compound-clustering"
entry_point = "compound_clustering.clustering:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Build tooling for build_and_register.py — not shipped in the wheel.
publish = ["techneos-management>=0.1,<1"]

# Local dev package index (devpi from the platform's dev stack) — where uv resolves
# techneos-management when this package is built/registered from its own directory.
[[tool.uv.index]]
name = "devpi"
url = "http://localhost:3141/simple/"
default = true
