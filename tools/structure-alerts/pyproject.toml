[project]
name = "structure-alerts"
version = "0.1.0"
description = "RDKit-powered PAINS and reactive-group structural-alert screening for SMILES"
# 3.12 to match techneos/tool-runtime (pypi tools install into that worker image
# at dispatch time, and rdkit wheels lag newer Python).
requires-python = ">=3.12,<3.13"
dependencies = [
    # rdkit unbounded for now — matches the other catalog tools. Worth pinning in
    # a follow-up once we have an integration suite to verify upgrades against.
    "rdkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structure_alerts"]

[tool.techneos]
delivery = "pypi"
package_name = "structure-alerts"
entry_point = "structure_alerts.checker:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Build tooling for build_and_register.py — not shipped in the wheel.
publish = ["techneos-management>=0.1,<1"]
