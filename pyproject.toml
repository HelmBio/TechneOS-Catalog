# Virtual root for the techneos-catalog repo.
#
# This is intentionally NOT a package and NOT a uv workspace: every catalog entry
# under tools/ and agents/ is a self-contained package with its own pyproject +
# lock, built and published individually. This root exists only to pin the tooling
# env to Python 3.12 (see [project] below).
#
# It carries no dependency group. techneos-management is resolved on demand against
# the active env's gateway index (bin/register.sh derives it from PLATFORM_API_URL):
# packaged tools/agents pull it from their own `publish` group, and the def-only
# scripts (datasets/, tasks/, pipelines/, apps/) from an ephemeral, lock-free env
# (`uv run --no-project --with techneos-management`). See bin/register.sh.

[project]
# Metadata only — `[tool.uv] package = false` below keeps this from being built or
# installed. Present so uv resolves the tooling env against Python 3.12 (matching
# the platform wheels + catalog tools) instead of defaulting to the newest CPython.
name = "techneos-catalog"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
# Do not implicitly treat this directory as a buildable package.
package = false
